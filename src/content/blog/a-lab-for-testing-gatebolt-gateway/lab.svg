<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>The lab: a laptop, a Proxmox server with three virtual machines, and Anthropic</title>
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="470" rx="14" fill="#ffffff"/>

  <!-- laptop -->
  <rect x="20" y="65" width="110" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="75" y="95" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">My laptop</text>

  <!-- Proxmox server -->
  <rect x="165" y="20" width="430" height="395" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="185" y="44" font-size="13" font-weight="600" fill="#4b5563">Proxmox server · 16 GB</text>

  <!-- control -->
  <rect x="195" y="62" width="370" height="56" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="380" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">control · 1 GB</text>
  <text x="380" y="106" text-anchor="middle" font-size="12" fill="#4b5563">holds the only login key</text>

  <!-- bench -->
  <rect x="195" y="160" width="160" height="200" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="275" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">bench · 8 GB</text>
  <text x="275" y="203" text-anchor="middle" font-size="12" fill="#4b5563">test harness, Docker</text>
  <rect x="210" y="262" width="130" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="275" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">task containers</text>
  <text x="275" y="297" text-anchor="middle" font-size="11" fill="#92400e">Claude Code</text>

  <!-- gatebolt -->
  <rect x="405" y="160" width="160" height="200" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="485" y="184" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">gatebolt · 5 GB</text>
  <text x="485" y="203" text-anchor="middle" font-size="12" fill="#4b5563">on Dokploy</text>
  <rect x="420" y="214" width="130" height="34" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="485" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">GateBolt</text>
  <rect x="420" y="262" width="130" height="44" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="485" y="289" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">gateway</text>
  <line x1="485" y1="262" x2="485" y2="250" stroke="#6366f1" stroke-width="1.5" marker-end="url(#grey)"/>
  <text x="493" y="258" font-size="10" fill="#4b5563">key check</text>

  <!-- Anthropic -->
  <rect x="630" y="257" width="120" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="690" y="279" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Anthropic</text>
  <text x="690" y="296" text-anchor="middle" font-size="11" fill="#4b5563">internet</text>

  <!-- logins (grey) -->
  <line x1="130" y1="90" x2="193" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#grey)"/>
  <text x="161" y="82" text-anchor="middle" font-size="11" fill="#4b5563">login</text>
  <line x1="275" y1="118" x2="275" y2="158" stroke="#6b7280" stroke-width="2" marker-end="url(#grey)"/>
  <line x1="485" y1="118" x2="485" y2="158" stroke="#6b7280" stroke-width="2" marker-end="url(#grey)"/>

  <!-- model traffic (blue) -->
  <line x1="340" y1="284" x2="418" y2="284" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <text x="380" y="322" text-anchor="middle" font-size="11" fill="#1d4ed8">Record,</text>
  <text x="380" y="336" text-anchor="middle" font-size="11" fill="#1d4ed8">Enforce</text>
  <line x1="550" y1="284" x2="628" y2="284" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M275 306 V390 H690 V309" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blue)"/>
  <text x="470" y="382" text-anchor="middle" font-size="11" fill="#1d4ed8">Direct, no gateway</text>

  <!-- legend -->
  <line x1="30" y1="445" x2="62" y2="445" stroke="#6b7280" stroke-width="2"/>
  <text x="70" y="449" font-size="12" fill="#374151">logins (SSH)</text>
  <line x1="190" y1="445" x2="222" y2="445" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="449" font-size="12" fill="#374151">requests to Claude</text>
  <rect x="380" y="437" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="404" y="449" font-size="12" fill="#374151">untrusted</text>
</svg>
